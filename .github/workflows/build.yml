name: build
# push 限定 stonecutter 分支: tag push (发版) 不再触发 build CI / push restricted to stonecutter branch: tag pushes no longer trigger build runs
on:
  push:
    branches: [ stonecutter ]
  pull_request:

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build with Gradle
        run: ./gradlew buildAndCollect --no-daemon --stacktrace --console=plain

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/
