# 版本目录 (LogFilter 裁剪版: 砍掉模板的 kotlin-jvm/ksp/foojay库/postprocess/fletching/mixinconstraints/vanniktech)
[versions]
foojay = "1.0.0"
stonecutter = "0.10-beta.1"
mod-publish = "2.1.1"
loomx = "0.4.1"
neoforge-moddev = "2.0.147"
serialization-json = "1.7.3"
serialization-toml = "0.6.0"

[libraries]
mod-publish-plugin = { module = "me.modmuss50:mod-publish-plugin", version.ref = "mod-publish" }
foojay-resolver = { module = "org.gradle.toolchains:foojay-resolver", version.ref = "foojay" }
kikugie-stonecutter = { module = "dev.kikugie:stonecutter", version.ref = "stonecutter" }
kikugie-loomx = { module = "dev.kikugie:loomx", version.ref = "loomx" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization-json" }
serialization-toml = { module = "dev.eav.tomlkt:tomlkt", version.ref = "serialization-toml" }

[plugins]
loom-back-compat = { id = "dev.kikugie.loom-back-compat", version.ref = "loomx" }
neoforged-moddev = { id = "net.neoforged.moddev", version.ref = "neoforge-moddev" }
# [LogFilter v6] legacyforge 与 moddev 同 artifact 同版本, forge 节点用 (marker 解析自 NeoForged maven, 仅 CI)
legacyforge-moddev = { id = "net.neoforged.moddev.legacyforge", version.ref = "neoforge-moddev" }
mod-publish-plugin = { id = "me.modmuss50.mod-publish-plugin", version.ref = "mod-publish" }
