distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 分发源改为腾讯镜像(2026-09 验证可达): 官方 services.gradle.org 在当前网络链路不可达,
# pwsh 直连超时, Java 侧 PKIX 失败; 本地 wrapper 缓存亦为残缺下载残留
# 注意: 是否将此镜像 URL 提交进仓库由项目所有者决定(可 revert 回官方 URL)
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.8-bin.zip
networkTimeout=10000
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
