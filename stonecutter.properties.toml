# LogFilter 全局元数据 + 版本特化依赖表 (build-logic 在构建期读取, 生成 fabric.mod.json / neoforge.mods.toml)
# Global mod metadata + per-version dependency tables, consumed by build-logic at build time.
[mod]
id = "logfilter"
name = "Log Filter"
group = "com.lmaxrouter.logfilter"
version = "1.2.0"
channel_tag = ""
description = """
A lightweight log filtering mod that intercepts and drops log lines by configurable rules (regex / exact match / logger name / log level / whitelist) before they reach the console and log files. Features an async output pipeline (Log4j2 AsyncAppender) and config hot-reload.
轻量级日志过滤模组：按可配置规则（正则/完全匹配/Logger名称/日志等级/白名单）在日志到达控制台和文件之前拦截丢弃。内置异步输出管线（Log4j2 AsyncAppender）与配置热重载。
"""
authors = ["LMaxRouterCN"]
contributors = []
inception_year = "2026"
license.name = "MPL-2.0"
license.url = "https://www.mozilla.org/en-US/MPL/2.0/"
license.dist = "repo"
environment = "client_and_server"
# 图标路径 (jar 根相对): 本体使用 pack.png, 与资源目录保持一致
# Icon path (relative to jar root): pack.png, matching the resources folder.
icon = "pack.png"
sources_url = "https://github.com/LMaxRouterCN/Log-Filter"
homepage_url = "https://github.com/LMaxRouterCN/Log-Filter"
issues_url = "https://github.com/LMaxRouterCN/Log-Filter/issues"
# dev 运行时 JVM 参数 (模板值, 含 IgnoreUnrecognizedVMOptions 兜底, 低版本 JDK 自动忽略新选项)
dev_jvm_args = [
	"-XX:+IgnoreUnrecognizedVMOptions",
	"-XX:+UseZGC",
	"-XX:+HeapDumpOnOutOfMemoryError",
	"-XX:HeapDumpPath=heapdump.hprof",
	"-XX:+ShowCodeDetailsInExceptionMessages",
	"-XX:+UseCompactObjectHeaders",
	"-XX:+AlwaysPreTouch",
	"-XX:+UseStringDeduplication",
	"-Dfile.encoding=UTF-8"
]

[fabric]
deps.fabric-loader = "0.19.2"
deps.nightconfig = "3.6.7"
# [LogFilter v6] fabric 1.18.2 / 1.19.2 新节点 (fabric-api 版本锚点见 GOAL-PLAN 版本表)
[fabric."1.18.2"]
deps.minecraft = "1.18.2"
deps.fabric-api = "0.77.0+1.18.2"
[fabric."1.19.2"]
deps.minecraft = "1.19.2"
deps.fabric-api = "0.77.0+1.19.2"

[fabric."1.20.1"]
deps.minecraft = "1.20.1"
deps.fabric-api = "0.92.12+1.20.1"

[fabric."1.21.1"]
deps.minecraft = "1.21.1"
deps.fabric-api = "0.116.7+1.21.1"

[fabric."1.21.11"]
deps.minecraft = "1.21.11"
deps.fabric-api = "0.141.6+1.21.11"

# [LogFilter v6] forge 全局段 + 三版本段 (版本锚点: minecraftforge.net 官方 maven 实查 2026-11-04)
[forge]
deps.nightconfig = "3.6.7"
[forge."1.18.2"]
deps.minecraft = "1.18.2"
deps.forge = "40.3.12"
[forge."1.19.2"]
deps.minecraft = "1.19.2"
deps.forge = "43.5.2"
[forge."1.20.1"]
deps.minecraft = "1.20.1"
deps.forge = "47.4.28"

[neoforge]
